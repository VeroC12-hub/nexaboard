    <!-- What a head teacher sees when the link is pasted into WhatsApp.

         Without these a shared link shows the bare address and no text,
         which reads as a broken or untrustworthy site, and sharing is how
         this spreads. og:image must be an absolute URL and a real raster
         file: WhatsApp will not render an SVG, and a relative path resolves
         against the scraper rather than the site. -->
    <meta name="description" content="Ghana's curriculum, taught. Every stage from creche to SHS, with lessons that work offline and a tutor that answers at eleven at night." />
    <meta name="theme-color" content="#2563eb" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexaBoard" />
    <meta property="og:title" content="NexaBoard: Ghana's curriculum, taught" />
    <meta property="og:description" content="Every stage from creche to SHS, with lessons that work offline and a tutor that answers at eleven at night." />
    <meta property="og:image" content="https://nexaboard-ten.vercel.app/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
